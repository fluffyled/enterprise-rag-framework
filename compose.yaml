services:
  llm:
    build:
      context: .
      dockerfile: Dockerfile.llm
    command: ["-m", "/models/llm3/qwen2.5-3b-instruct-q4_k_m.gguf", "--host", "0.0.0.0", "--port", "8080", "-c", "8192", "-t", "4"]
    volumes:
      - ./models:/models:ro
    networks: [private]
  app:
    build: .
    environment:
      LLM_ENDPOINT: http://llm:8080/v1/chat/completions
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models:ro
    depends_on: [llm]
    networks: [private]
networks:
  private:
    internal: true
